[project]
name = "plane-ce-mcp"
version = "0.1.0"
description = "MCP server for this Plane Community Edition API"
requires-python = ">=3.12"
dependencies = ["mcp==1.28.1", "httpx==0.28.1", "uvicorn>=0.30,<1"]

[project.scripts]
plane-ce-mcp = "plane_ce_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.9.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
